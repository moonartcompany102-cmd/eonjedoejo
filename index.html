<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>언제되조?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 상단 4단계 내비 + 단계별 작업 화면(데스크톱은 입력 | 결과 2열, 폰은 1열) */
  --bg:#F6F4FB;
  --surface:#FFFFFF;
  --surface-2:#F0EDF8;
  --ink:#2B2840;
  --muted:#6B6782;
  --line:#E3DFEF;
  --lav:#B9A7F5;  --lav-ink:#5B45C9;
  --mint:#A8E6CF; --mint-ink:#1D7454;
  --peach:#FFD3B6; --peach-ink:#9C4C22;
  --sky:#A7D8F5;  --sky-ink:#225F84;
  --on-accent:#FFFFFF;
  --warn:#B4400F; --warn-bg:#FFEEE4;
  --shadow:0 1px 0 rgba(43,40,64,.04),0 10px 28px rgba(91,69,201,.08);
  --font-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1923; --surface:#23212E; --surface-2:#2C2939; --ink:#EEEBF8; --muted:#A8A3BF; --line:#3A3650;
    --lav-ink:#CDBFFF; --mint-ink:#8EE0BF; --peach-ink:#FFC39D; --sky-ink:#A3D6F7;
    --on-accent:#1A1923; --warn:#FFA477; --warn-bg:#3A2519;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1923; --surface:#23212E; --surface-2:#2C2939; --ink:#EEEBF8; --muted:#A8A3BF; --line:#3A3650;
  --lav-ink:#CDBFFF; --mint-ink:#8EE0BF; --peach-ink:#FFC39D; --sky-ink:#A3D6F7;
  --on-accent:#1A1923; --warn:#FFA477; --warn-bg:#3A2519;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav-ink);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-size:22px}
.logo-mark{width:30px;height:30px;border-radius:10px;background:var(--lav);display:grid;place-items:center}
.nav-team{display:flex;gap:6px;margin-left:auto;min-width:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps[hidden]{display:none}
.team-name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* 계정 표시 */
.acct{position:relative;order:4}
.nav-team{order:2}
.steps{order:3}
.logo{order:1}
.acct > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.acct > summary::-webkit-details-marker{display:none}
.acct > summary:hover{background:var(--surface-2)}
.acct-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--mint);color:#17583F}
.acct.out .acct-dot{background:var(--warn-bg);color:var(--warn)}
.acct-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;z-index:40;font-size:14px}
.acct-pop ol{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:13px}
.banner .btn{margin-top:8px}
.step{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;border:1px solid transparent}
.step:hover{background:var(--surface-2);color:var(--ink)}
.step[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.step-n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted);font-weight:700}
.step.done .step-n{background:var(--mint);color:#17583F}
@media (max-width:720px){
  .top-in{gap:8px 12px;padding:10px 16px}
  .nav-team .step{padding:6px 10px;font-size:13px}
  .nav-team{order:3;width:100%;margin-left:0}
  .acct{order:2;margin-left:auto}
  .steps{order:4}
  .team-name{max-width:60vw}
  .steps{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .steps .step{flex-direction:column;justify-content:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;text-align:center;line-height:1.25;background:var(--surface-2)}
  .steps .step[aria-current="page"]{background:var(--surface);border-color:var(--lav-ink)}
}
@media (max-width:1000px) and (min-width:721px){.steps{width:100%;justify-content:flex-end}}

main{max-width:1080px;margin:0 auto;padding:20px 16px 80px;display:grid;gap:16px}
.banner{padding:12px 16px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:grid;gap:14px;align-content:start;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head p{margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
@media (max-width:860px){.grid2,.grid2.even{grid-template-columns:1fr}}
.view-head{display:grid;gap:4px;padding:4px 2px}
.view-head .eyebrow{font-size:13px;font-weight:700;color:var(--lav-ink)}

.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--lav) 38%,var(--surface)),color-mix(in srgb,var(--sky) 30%,var(--surface)));border:none}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .eyebrow{font-size:14px;font-weight:700;color:var(--lav-ink)}

/* 폼 */
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.in,textarea.in,select.in{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px}
textarea.in{min-height:150px;resize:vertical;line-height:1.6}
.in:focus{border-color:var(--lav-ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 40%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 140px}
.row > .shrink{flex:0 0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;text-align:center;line-height:1.35;max-width:100%}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--lav-ink);border-color:var(--lav-ink);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--lav-ink);padding:6px 8px}
.btn.big{padding:13px 20px;font-size:15px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);max-width:100%;line-height:1.4}
.pill.ok{background:color-mix(in srgb,var(--mint) 55%,var(--surface));color:var(--mint-ink)}
.pill.lav{background:color-mix(in srgb,var(--lav) 40%,var(--surface));color:var(--lav-ink)}
.pill.peach{background:color-mix(in srgb,var(--peach) 60%,var(--surface));color:var(--peach-ink)}
.pill.sky{background:color-mix(in srgb,var(--sky) 50%,var(--surface));color:var(--sky-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.empty{padding:28px 16px;border-radius:14px;background:var(--surface-2);text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.err{padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.skel{height:72px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--lav) 18%,var(--surface-2)),var(--surface-2));background-size:200% 100%;animation:sh 1.4s ease infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.spin,.skel{animation:none}}

/* 홈 */
.members{display:grid;gap:8px}
.member{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto;color:#2B2840}
.member{flex-wrap:wrap}
.member .nm{font-weight:700;min-width:0}
.member .chips{margin-left:auto;justify-content:flex-end;min-width:0}
.stepcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.stepcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.stepcards{grid-template-columns:1fr}}
.stepcard{display:grid;gap:8px;padding:16px;border-radius:16px;background:var(--surface-2);text-decoration:none;color:var(--ink);border:1px solid transparent;align-content:start}
.stepcard:hover{border-color:var(--lav)}
.stepcard .k{font-family:var(--font-display);font-size:28px;color:var(--lav-ink);line-height:1}
.stepcard h3{font-size:17px}
ol.howto{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}

/* 1. 역할 */
.drop{display:grid;place-items:center;gap:6px;padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;background:var(--surface-2)}
.drop.over,.drop:hover{border-color:var(--lav-ink);color:var(--ink)}
.drop strong{color:var(--lav-ink)}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.file img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.file .ft{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:11px;color:var(--lav-ink);flex:0 0 auto}
.file .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.role{border-radius:16px;padding:14px;display:grid;gap:8px;border:1px solid var(--line);background:var(--surface);position:relative;align-content:start}
.role .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.role-top{display:flex;gap:10px;align-items:center;min-width:0;padding-right:44px}
.role-name{flex:1;min-width:0;width:100%;border:none;background:transparent;font-weight:700;font-size:16px;padding:4px 6px;border-radius:8px}
.role-name:hover,.role-name:focus{background:var(--surface-2);outline:none}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stepper .cnt{min-width:46px;text-align:center;font-weight:700;font-size:18px}
.role .x{position:absolute;top:8px;right:8px}
.sumbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.sumbar .big{font-family:var(--font-display);font-size:22px}

/* 2. 설문 */
.q{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.q:last-child{border-bottom:none}
.q-t{font-weight:500}
.q-t .qn{color:var(--lav-ink);font-weight:700;margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:grid;place-items:center;text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);font-size:12px;line-height:1.3;cursor:pointer;min-height:44px;background:var(--surface)}
.scale input:checked + span{background:var(--lav-ink);border-color:var(--lav-ink);color:var(--on-accent);font-weight:700}
.scale input:focus-visible + span{outline:3px solid var(--lav-ink);outline-offset:2px}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lav-ink);border-radius:99px}
.typebox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.typebox > :first-child{flex:0 1 320px;min-width:0;display:flex;justify-content:center}
.typebox > :last-child{flex:1 1 240px;min-width:0}
.typebox svg{max-width:100%;height:auto;overflow:visible}
@media (max-width:520px){.typebox{justify-content:center;text-align:center}.typebox .chips{justify-content:center}}
.typename{font-family:var(--font-display);font-size:26px;color:var(--lav-ink)}
.recs{display:grid;gap:8px}
.rec{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.rec .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.rec .bar i{display:block;height:100%;background:var(--mint-ink)}
.alloc{width:100%;border-collapse:collapse;font-size:14px}
.alloc th,.alloc td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.alloc th{font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:600px){
  .alloc thead{display:none}
  .alloc,.alloc tbody,.alloc tr,.alloc td{display:block;width:100%}
  .alloc tr{padding:12px 0;border-bottom:1px solid var(--line)}
  .alloc td{border:none;padding:4px 0;min-width:0 !important}
  .alloc td:nth-child(2){padding-left:44px;margin-top:-6px}
}
.hero-actions{display:grid;gap:8px;justify-items:end}
@media (max-width:600px){.hero-actions{justify-items:start;width:100%}.hero-actions .btn.big{width:100%}}
.tbl-wrap{overflow-x:auto}
.alloc td:first-child b,.alloc td .pill{white-space:nowrap}

/* 3. 마감 */
.gantt{display:grid;gap:10px}
.g-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:600px){.g-row{grid-template-columns:1fr}}
.g-label{display:grid;gap:2px}
.g-label b{font-size:14px}
.g-track{position:relative;height:34px;border-radius:10px;background:var(--surface-2)}
.g-bar{position:absolute;top:5px;bottom:5px;border-radius:8px;min-width:8px}
.g-due{position:absolute;top:50%;transform:translate(-100%,-50%);font-size:12px;font-weight:700;padding-right:8px;white-space:nowrap;color:#2B2840}
.g-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.dl-list{display:grid;gap:10px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line)}
@media (max-width:560px){.dl{grid-template-columns:auto 1fr}.dl .dl-date{grid-column:1 / -1}}
.dl .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.dl-sent{font-weight:700}
.dl-date{display:flex;gap:8px;align-items:center}
.dl-date{flex-wrap:wrap}
.dl-date input{width:160px;max-width:100%}
.dday{font-family:var(--font-display);font-size:34px;color:var(--lav-ink);line-height:1}

/* 4. 모임 */
.av-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.av{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.av .d{font-weight:700;font-size:14px}
.av .d.sun{color:#D2465A} .av .d.sat{color:var(--sky-ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{padding:7px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;font-weight:500}
.slot[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#17583F;font-weight:700}
.heat{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.heat th{font-weight:500;color:var(--muted);text-align:left;padding:2px 6px;white-space:nowrap}
.heat td{padding:0}
.hc{width:100%;min-width:64px;padding:8px 4px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-weight:700;color:var(--ink);text-align:center}
.hc.full{border-color:var(--mint-ink)}
.hc.picked{outline:3px solid var(--lav-ink);outline-offset:1px}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:12px;border-radius:4px;vertical-align:middle;margin-right:4px}
.meetrec{display:grid;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line)}
.meetrec.top{border-color:var(--mint-ink);background:color-mix(in srgb,var(--mint) 18%,var(--surface))}
.meetrec .when{font-family:var(--font-display);font-size:20px}
.picked-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--mint) 35%,var(--surface))}
.picked-box .when{font-family:var(--font-display);font-size:22px;color:var(--mint-ink)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.avoid-box{display:grid;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.avoid-row{align-items:flex-end}
.avoid-row .f{flex:1 1 140px;min-width:0}
@media (max-width:600px){.avoid-row{border-bottom:1px solid var(--line);padding-bottom:10px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#home" aria-label="언제되조? 홈">
      <span class="logo-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2840" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5M11 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5"/></svg>
      </span>
      언제되조?
    </a>

/* =============================== 유틸 =============================== */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o || {}));
const clamp = (n,a,b) => Math.min(b, Math.max(a, n));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d] = s.split('-').map(Number); const x = new Date(y, m-1, d); return isNaN(x) ? null : x; };
const todayStr = () => ymd(new Date());
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const fmtD = s => { const d = parseD(s); return d ? `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})` : '-'; };
const fmtShort = s => { const d = parseD(s); return d ? `${d.getMonth()+1}/${d.getDate()}` : '-'; };
const ddayLabel = s => { const n = diffDays(todayStr(), s); return n === 0 ? 'D-Day' : n > 0 ? `D-${n}` : `D+${-n}`; };
const slotLabel = k => (SLOTS.find(s => s.k === k) || {}).l || k;
function roleIcon(name){
  const n = name || '';
  const map = [[/발표/,'🎤'],[/PPT|피피티|슬라이드|디자인/i,'🎨'],[/조사|리서치|자료/,'🔎'],[/보고서|작성|원고|글/,'📝'],[/편집|영상/,'🎬'],[/총괄|팀장|리더|PM/i,'🧭'],[/설문|인터뷰/,'📋'],[/분석|통계|데이터/,'📊'],[/검수|정리|교정/,'✅'],[/코딩|개발|구현/,'💻']];
  for(const [re,ic] of map) if(re.test(n)) return ic;
  return '📌';
}
function sortedMembers(){
  return Object.entries(S.members).map(([id,m]) => ({id, ...m})).sort((a,b) => (a.joinedAt||0) - (b.joinedAt||0));
}
const me = () => S.members[S.uid] || null;
const roles = () => ((S.team.assignment && S.team.assignment.roles) || []);
function memberColor(id){ const ids = sortedMembers().map(m => m.id); const i = Math.max(0, ids.indexOf(id)); return AV_TINTS[i % AV_TINTS.length]; }
function avatar(m){ return `<span class="avatar" style="background:${memberColor(m.id)}" aria-hidden="true">${esc((m.name||'?').trim().slice(0,1))}</span>`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* =============================== 저장 =============================== */
function queue(key, fn){ const p = (S.q[key] || Promise.resolve()).then(fn); S.q[key] = p.catch(() => {}); return p; }
function persistLocal(){ try{ localStorage.setItem('teamplmate-local-v2', JSON.stringify({teams:S.teams, meDoc:S.meDoc})); }catch(e){} }
// 조원 문서: {name, answers, scores, surveyedAt, teamIds:[...], t:{팀코드:{joinedAt, type, avail, availSaved}}}
const GLOBAL_KEYS = ['name','answers','scores','surveyedAt'];
function flatMember(doc, teamId){
  const t = (doc && doc.t && doc.t[teamId]) || {};
  return Object.assign({name: doc.name, answers: doc.answers, scores: doc.scores, surveyedAt: doc.surveyedAt}, t);
}
function inTeam(doc, teamId){ return !!(doc && teamId && (doc.teamIds || []).includes(teamId)); }
function refreshMe(){
  if(inTeam(S.meDoc, S.teamId)) S.members[S.uid] = flatMember(S.meDoc, S.teamId);
  else delete S.members[S.uid];
}
function syncTeam(){ S.team = clone(S.teams[S.teamId] || {}); S.teamExists = !!S.teams[S.teamId]; }
function myTeamIds(){ return ((S.meDoc && S.meDoc.teamIds) || []).filter(id => S.teams[id]); }
function saveMemberDoc(g, tp, extra, tid){
  if(S.readOnly){ toast('보기 전용 권한이라 저장할 수 없어요.'); return Promise.resolve(); }
  tid = tid || S.teamId;
  g = clone(g); tp = clone(tp); extra = clone(extra);
  const hasT = tid && Object.keys(tp).length;
  const doc = clone(S.meDoc || {});
  Object.assign(doc, g, extra);
  if(hasT){ doc.t = doc.t || {}; doc.t[tid] = Object.assign({}, doc.t[tid] || {}, tp); }
  S.meDoc = doc; refreshMe(); scheduleRender();
  if(S.mode !== 'live'){ persistLocal(); return Promise.resolve(); }
  const payload = Object.assign({}, g, extra);
  if(hasT) payload.t = {[tid]: tp};
  return queue('me', async () => {
    const ref = S.db.doc('members/' + S.uid);
    if(S.meExists) await ref.update(payload); else { await ref.set(clone(S.meDoc)); S.meExists = true; }
  }).catch(handleWriteErr);
}
function saveMe(patch){
  const g = {}, tp = {};
  Object.entries(patch).forEach(([k,v]) => { (GLOBAL_KEYS.includes(k) ? g : tp)[k] = v; });
  return saveMemberDoc(g, tp, {});
}
function joinTeam(tid, name){
  const ids = Array.from(new Set([...((S.meDoc && S.meDoc.teamIds) || []), tid]));
  const had = S.meDoc && S.meDoc.t && S.meDoc.t[tid];
  const tp = had ? {joinedAt: had.joinedAt || Date.now()} : {joinedAt: Date.now(), avail: [], availSaved: false};
  return saveMemberDoc(name ? {name} : {}, tp, {teamIds: ids}, tid);
}
function leaveTeam(tid){
  const ids = ((S.meDoc && S.meDoc.teamIds) || []).filter(x => x !== tid);
  return saveMemberDoc({}, {}, {teamIds: ids});
}
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function newCode(){
  for(let i = 0; i < 8; i++){
    let c = ''; for(let j = 0; j < 6; j++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    if(S.teams[c]) continue;
    if(S.mode === 'live'){ const s = await S.db.doc('teams/' + c).get(); if(s.exists) continue; }
    return c;
  }
  throw new Error('팀 코드를 만들지 못했어요');
}
async function createTeam(info, name){
  if(S.readOnly){ toast('보기 전용 권한이라 팀을 만들 수 없어요.'); return; }
  let code;
  try{ code = await newCode(); }catch(e){ toast('팀을 만들지 못했어요. 다시 시도해 주세요.'); return; }
  const team = Object.assign({}, info, {createdAt: Date.now(), createdBy: S.uid});
  S.teams[code] = team;
  if(S.mode === 'live'){
    try{ await S.db.doc('teams/' + code).set(team); }
    catch(e){ delete S.teams[code]; handleWriteErr(e); return; }
  }
  await joinTeam(code, name);
  location.hash = 't-' + code;
  toast(`팀을 만들었어요. 팀 코드는 ${code}예요.`);
}
async function deleteTeam(tid){
  await leaveTeam(tid);
  delete S.teams[tid];
  if(S.mode === 'live') await S.db.doc('teams/' + tid).delete().catch(handleWriteErr);
  else persistLocal();
  location.hash = 'home';
  toast('팀을 삭제했어요.');
}
function handleWriteErr(e){
  const c = e && e.code;
  if(c === 'permission-denied'){ toast('이 작업은 할 수 없어요. 내 정보와 내가 참여한 팀만 고칠 수 있어요.'); }
  else if(c === 'resource-exhausted'){ toast('오늘 무료 사용량을 다 썼어요. 내일 다시 시도해 주세요.'); }
  else if(c === 'unavailable'){ toast('서버에 연결하지 못했어요. 인터넷이 연결되면 자동으로 저장돼요.'); }
  else { toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  scheduleRender();
}
function saveTeam(patch){
  if(S.readOnly){ toast('보기 전용 권한이라 저장할 수 없어요.'); return Promise.resolve(); }
  const tid = S.teamId;
  if(!tid) return Promise.resolve();
  S.teams[tid] = Object.assign({}, S.teams[tid] || {}, clone(patch));
  syncTeam();
  scheduleRender();
  if(S.mode !== 'live'){ persistLocal(); return Promise.resolve(); }
  return queue('team-' + tid, async () => {
    await S.db.doc('teams/' + tid).update(clone(patch));
  }).catch(handleWriteErr);
}
function removeMember(id){
  const raw = S.rawMembers[id];
  delete S.members[id];
  scheduleRender();
  if(S.mode !== 'live' || !raw) return;
  S.db.doc('members/' + id).update({teamIds: (raw.teamIds || []).filter(x => x !== S.teamId)}).catch(handleWriteErr);
}

/* =============================== 계산 엔진 (AI 없이 규칙·알고리즘으로) =============================== */
function runCalc(key, fn){
  S.errors[key] = null;
  try{ fn(); }
  catch(e){ console.error(e); S.errors[key] = (e && e.message) || '계산하지 못했어요. 입력을 확인해 주세요.'; }
  render();
}
function calcBtn(act, label, disabled){
  return `<button class="btn primary big" data-act="${act}" ${disabled ? 'disabled' : ''}>${esc(label)}</button>`;
}
function errBox(key){ return S.errors[key] ? `<div class="err" role="alert">${esc(S.errors[key])}</div>` : ''; }

/* ---------- 역할 사전 ----------
   comp/comp2: 이 역할에 중요한 역량(1순위·2순위), stage: 작업 순서(0=총괄, 1=조사, 2=작성, 3=제작, 4=발표) */

  survey:  {name:'설문·인터뷰',  icon:'📋', comp:'comm',     comp2:'research', stage:1, desc:'설문지를 만들어 배포하거나 인터뷰를 진행하고 응답을 모아요.', skills:['질문 설계','섭외','응답 정리']},
  data:    {name:'데이터 분석',  icon:'📊', comp:'research', comp2:'detail',   stage:2, desc:'모은 데이터를 표와 그래프로 분석하고 결과를 해석해요.', skills:['엑셀·통계','해석','시각화']},
  dev:     {name:'개발·구현',    icon:'💻', comp:'detail',   comp2:'research', stage:2, desc:'기획한 내용을 프로그램이나 시제품으로 구현해요.', skills:['구현','테스트','문제 해결']},
  report:  {name:'보고서 작성',  icon:'📝', comp:'detail',   comp2:'research', stage:2, desc:'조사 내용을 바탕으로 보고서를 쓰고 양식과 분량을 맞춰요.', skills:['글쓰기','구성','양식 맞추기']},
  ppt:     {name:'PPT 제작',     icon:'🎨', comp:'design',   comp2:'detail',   stage:3, desc:'핵심 내용을 슬라이드로 옮기고 도표와 디자인을 다듬어요.', skills:['슬라이드 디자인','도식화','요약']},
  visual:  {name:'디자인·시각자료', icon:'🖼️', comp:'design', comp2:'comm',    stage:3, desc:'포스터·카드뉴스·인포그래픽 같은 시각 자료를 만들어요.', skills:['디자인 툴','레이아웃','색감']},
  video:   {name:'영상 제작',    icon:'🎬', comp:'design',   comp2:'present',  stage:3, desc:'촬영 계획을 세우고 영상을 찍어 편집해요.', skills:['촬영','편집','자막']},
  present: {name:'발표',         icon:'🎤', comp:'present',  comp2:'comm',     stage:4, desc:'발표 대본을 쓰고 리허설한 뒤 발표와 질의응답을 맡아요.', skills:['말하기','대본 작성','질의응답']}
};
const DEFAULT_ROLE_KEYS = ['research','report','ppt','present','lead'];
// 역할 이름만 있을 때(직접 추가한 역할 등) 어떤 역할인지 추정
const ROLE_NAME_RULES = [
  [/총괄|팀장|조장|리더|PM|일정/i,'lead'], [/발표|스피치/,'present'], [/영상|촬영|편집/,'video'],
  [/PPT|피피티|슬라이드/i,'ppt'], [/포스터|카드뉴스|디자인|시각/,'visual'], [/설문|인터뷰/,'survey'],
  [/분석|통계|데이터/,'data'], [/개발|구현|코딩/,'dev'], [/보고서|작성|원고|글|문서/,'report'], [/조사|리서치|자료/,'research']
];
function libKeyOf(name){ for(const [re,k] of ROLE_NAME_RULES) if(re.test(name || '')) return k; return null; }
function roleMeta(r){
  const k = libKeyOf(r.name), L = k ? ROLE_LIB[k] : null;
  const c1 = COMP[r.competency] ? r.competency : (L ? L.comp : 'research');
  const c2 = COMP[r.competency2] ? r.competency2 : (L ? L.comp2 : c1);
  const stage = Number.isInteger(r.stage) ? r.stage : (L ? L.stage : 2);
  const stageEnd = Number.isInteger(r.stageEnd) ? r.stageEnd : stage;
  return {c1, c2, stage, stageEnd};
}

/* ---------- 1. 과제 글 분석 → 역할·인원 ---------- */
const DETECT = [
  {k:'report',  re:/보고서|레포트|리포트|소논문|에세이|원고|기획서|제안서|결과서|\d+\s*(?:쪽|페이지|매)|A4/i},
  {k:'ppt',     re:/PPT|피피티|슬라이드|파워포인트|장표|키노트|발표\s*자료/i},
  {k:'present', re:/발표|프레젠테이션|스피치|질의\s*응답|Q\s*&\s*A|피칭/i},
  {k:'video',   re:/영상|동영상|유튜브|촬영|UCC|브이로그/i},
  {k:'survey',  re:/설문|인터뷰|면담|FGI|현장\s*조사|관찰\s*조사/i},
  {k:'data',    re:/통계|SPSS|엑셀|회귀|데이터\s*분석|빅데이터|R\s*프로그래밍|파이썬/i},
  {k:'dev',     re:/코딩|개발|구현|프로그래밍|앱\s*(?:제작|개발)|어플|웹\s*사이트|프로토타입|아두이노|시제품/i},
  {k:'visual',  re:/포스터|카드\s*뉴스|인포그래픽|브로슈어|리플렛|팸플릿|전시/i},
  {k:'lead',    re:/총괄|조장|팀장|PM\b/i}
];
const maxNum = (text, re) => { let best = 0, m; re.lastIndex = 0; while((m = re.exec(text))){ const v = Math.max(0, ...m.slice(1).map(x => Number(x) || 0)); if(v > best && v < 500) best = v; } return best; };
function analyzeText(text, size){
  const T = text.replace(/\s+/g, ' ');
  const found = new Set(DETECT.filter(d => d.re.test(T)).map(d => d.k));
  const pages   = maxNum(T, /(\d+)\s*(?:[~\-〜]\s*(\d+))?\s*(?:쪽|페이지|매)/g);
  const slides  = maxNum(T, /(\d+)\s*(?:[~\-〜]\s*(\d+))?\s*장\s*(?:내외|이내|이상|분량)?/g);
  const minutes = maxNum(T, /발표[^\d.。]{0,8}(\d+)\s*(?:[~\-〜]\s*(\d+))?\s*분|(\d+)\s*분\s*(?:내외\s*)?(?:발표|프레젠)/g);
  const vmin    = maxNum(T, /영상[^\d.。]{0,8}(\d+)\s*(?:[~\-〜]\s*(\d+))?\s*분|(\d+)\s*분\s*(?:내외\s*|이내\s*)?(?:의\s*)?(?:영상|동영상)/g);
  const pm = T.match(/발표자\s*(\d+)\s*명/);
  const presenters = pm ? Math.max(1, Number(pm[1])) : 0;
  const tips = [];

  let keys = ['research'];
  ['survey','data','dev','report','ppt','visual','video','present'].forEach(k => { if(found.has(k)) keys.push(k); });
  const outputs = ['report','ppt','present','video','visual','dev'];
  let generic = false;
  if(!keys.some(k => outputs.includes(k))){ keys = ['research','report','ppt','present']; generic = true; }
  if(size >= 4 || found.has('lead')) keys.unshift('lead');

  const weight = {
    lead: 0.8, research: found.has('survey') ? 2 : 3, survey: 2, data: 2, dev: 3,
    report: 2 + Math.min(3, pages / 5), ppt: 1.5 + Math.min(2, slides / 15),
    visual: 1.5, video: 2.5 + Math.min(2, vmin / 5), present: 1
  };
  const cap = {lead: 1, present: presenters || (minutes >= 15 && size >= 6 ? 2 : 1)};

  let list = keys.map(k => { const L = ROLE_LIB[k]; return {key:k, name:L.name, icon:L.icon, description:L.desc, skills:L.skills.slice(), competency:L.comp, competency2:L.comp2, stage:L.stage, stageEnd:L.stage, w:weight[k], cap:cap[k] || 99}; });

  // 조원보다 역할이 많으면 비슷한 역할끼리 합쳐요
  const merge = (aKey, bKey, name, tip) => {
    const a = list.find(r => r.key === aKey), b = list.find(r => r.key === bKey);
    if(!a || !b || list.length <= size) return;
    const SHORT = {survey:'설문', data:'분석', report:'보고서', present:'발표', visual:'시각자료', dev:'개발', ppt:'PPT', video:'영상', research:'조사'};
    a.name = (a.merged ? `${a.name}·${SHORT[b.key] || b.name}` : name).slice(0, 20); a.merged = true; a.w += b.w; a.cap = Math.max(a.cap, b.cap) === 99 ? 99 : a.cap + b.cap;
    a.description = a.description + ' ' + b.description;
    a.skills = Array.from(new Set([...a.skills.slice(0,2), ...b.skills.slice(0,1)]));
    a.stage = Math.min(a.stage, b.stage); a.stageEnd = Math.max(a.stageEnd, b.stageEnd);
    list = list.filter(r => r !== b);
    if(tip) tips.push(tip);
  };
  if(list.length > size && list.some(r => r.key === 'lead')){ list = list.filter(r => r.key !== 'lead'); tips.push('조원 수가 적어 총괄은 따로 두지 않았어요. 발표 담당이 일정 관리를 함께 챙겨 주세요.'); }
  merge('ppt', 'present', 'PPT·발표', 'PPT를 만든 사람이 발표하면 내용을 가장 잘 설명할 수 있어요.');
  merge('ppt', 'visual', 'PPT·시각자료');
  merge('research', 'survey', '자료조사·설문');
  merge('research', 'data', '자료조사·분석');
  merge('video', 'present', '영상·발표');
  merge('report', 'dev', '개발·문서화');
  merge('research', 'report', '조사·보고서 작성', '조사한 사람이 바로 보고서를 쓰면 전달 과정에서 빠지는 내용이 줄어요.');
  while(list.length > size && list.length > 1){   // 그래도 많으면 가까운 단계끼리 차례로 합쳐요
    list.sort((a,b) => a.stage - b.stage);
    let bi = 0, bw = Infinity;
    for(let i = 0; i < list.length - 1; i++){ const w = list[i].w + list[i+1].w; if(w < bw){ bw = w; bi = i; } }
    const a = list[bi], b = list[bi+1];
    merge(a.key, b.key, `${a.name}·${b.name}`.slice(0, 20));
  }

  // 한 명씩 배정한 뒤 남는 인원은 분량(가중치)이 큰 역할부터 (동트 방식)
  list.forEach(r => r.count = 1);
  for(let left = size - list.length; left > 0; left--){
    let best = null, bv = -1;
    list.forEach(r => { if(r.count >= r.cap) return; const v = r.w / (r.count + 1); if(v > bv){ bv = v; best = r; } });
    (best || list.find(r => r.key === 'research') || list[0]).count++;
  }
  list.sort((a,b) => a.stage - b.stage || b.w - a.w);

  const deliverables = [];
  if(found.has('report')) deliverables.push('보고서' + (pages ? ` ${pages}쪽` : ''));
  if(found.has('ppt')) deliverables.push('PPT' + (slides ? ` ${slides}장` : ''));
  if(found.has('present')) deliverables.push('발표' + (minutes ? ` ${minutes}분` : ''));
  if(found.has('video')) deliverables.push('영상' + (vmin ? ` ${vmin}분` : ''));
  if(found.has('visual')) deliverables.push('시각자료');
  if(found.has('dev')) deliverables.push('구현물');
  if(found.has('survey')) deliverables.push('설문·인터뷰');
  if(generic) tips.unshift('과제 글에서 제출물을 찾지 못해 보고서·PPT·발표가 있는 일반적인 팀플로 나눴어요. 필요 없는 역할은 지우고 맞게 고쳐 주세요.');
  if(pages >= 15) tips.push(`보고서가 ${pages}쪽으로 길어서 작성 인원을 넉넉히 잡았어요.`);
  if(presenters > 1) tips.push(`발표자가 ${presenters}명 필요해서 발표 인원을 맞췄어요.`);

  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const topic = lines.map(l => l.match(/^[-·•*]?\s*(?:주제|과제명|과제|제목)\s*[:：]\s*(.+)/)).find(Boolean);
  const summary = (topic ? topic[1] : (lines[0] || '').replace(/^\[[^\]]*\]\s*/, '')).slice(0, 100);

  return {
    summary, deliverables, tips: tips.join(' '),
    roles: list.map(r => ({name:r.name, icon:r.icon, count:r.count, description:r.description, skills:r.skills.slice(0,3), competency:r.competency, competency2:r.competency2, stage:r.stage, stageEnd:r.stageEnd}))
  };
}
function analyze(){
  const text = (S.draft.assignText != null ? S.draft.assignText : ((S.team.assignment||{}).sourceText || '')).trim();
  const ok = S.draft.files.filter(f => f.status === 'ok' && f.text);
  const fileText = ok.map(f => f.text.trim()).join('\n\n');
  const size = Number(S.draft.size || S.team.size || sortedMembers().length || 0);
  runCalc('assign', () => {
    if(!text && !fileText) throw new Error('과제 내용을 붙여넣거나 파일을 올려 주세요.');
    if(!size || size < 1) throw new Error('조원 수를 입력해 주세요.');
    const material = (text + '\n\n' + fileText).trim().slice(0, 40000);
    const r = analyzeText(material, size);
    saveTeam({size, assignment: Object.assign(r, {sourceText: material.slice(0, 6000), confirmed: false, at: Date.now()})});
    S.draft.assignText = null;
    toast(`역할 ${r.roles.length}개로 나눴어요. 인원과 이름은 직접 고칠 수 있어요.`);
  });
}

const TYPE_ADJ   = {lead:'든든한', detail:'꼼꼼한', present:'당당한', design:'감각적인', research:'호기심 많은', comm:'다정한'};

const CAUTION = {

  present:'발표가 부담되면 대본을 미리 써 두고 한 번만 소리 내어 연습해 봐요.',
  design:'디자인이 막막하면 템플릿 하나를 정해 팀 전체가 같이 쓰면 충분해요.',

};
function rankComps(sc){ return COMP_KEYS.slice().sort((a,b) => (sc[b]||0) - (sc[a]||0) || COMP_KEYS.indexOf(a) - COMP_KEYS.indexOf(b)); }
function typeFrom(sc){
  if(!sc) return null;
  const rk = rankComps(sc), hi = sc[rk[0]] || 0, lo = sc[rk[5]] || 0;
  const flat = hi - lo <= 12;
  return {
    name: flat ? '균형 잡힌 올라운더' : `${TYPE_ADJ[rk[1]]} ${TYPE_NOUN[rk[0]]}`,
    emoji: flat ? '🌈' : TYPE_EMOJI[rk[0]],
    summary: flat ? '여러 역량이 고르게 높아 어떤 역할을 맡아도 제 몫을 해내는 사람이에요. 팀에 빈자리가 생기면 가장 먼저 채워 줄 수 있어요.'
                  : `${TYPE_S1[rk[0]]} ${TYPE_S2[rk[1]]}`,
    strengths: rk.slice(0, 3).map(k => STRENGTH[k]),
    caution: CAUTION[rk[5]]
  };
}
const typeOf = m => (m && m.scores) ? typeFrom(m.scores) : null;
function fitOf(sc, r){ const mt = roleMeta(r); return Math.round(0.7 * (sc[mt.c1]||0) + 0.3 * (sc[mt.c2]||0)); }
function recommendRoles(sc){
  const rs = roles().length ? roles() : DEFAULT_ROLE_KEYS.map(k => ({name: ROLE_LIB[k].name}));
  return rs.map(r => {
    const mt = roleMeta(r), s = sc[mt.c1] || 0, fit = fitOf(sc, r);
    const lv = s >= 75 ? '높은 편이라' : s >= 50 ? '괜찮은 편이라' : '다른 역량보다는 나은 편이라';
    return {role: r.name, fit, reason: `이 역할에 중요한 ${COMP[mt.c1].label} 점수가 ${s}점으로 ${lv} 잘 맞아요.`};
  }).sort((a,b) => b.fit - a.fit).slice(0, 3);
}

/* ---------- 2-2. 팀 전체 배정: 헝가리안 알고리즘으로 적합도 합이 가장 큰 배정 ---------- */
function hungarian(cost){   // n×n 비용 행렬의 최소 비용 배정. 반환: 행 → 열
  const n = cost.length, INF = 1e15;
  const u = Array(n+1).fill(0), v = Array(n+1).fill(0), p = Array(n+1).fill(0), way = Array(n+1).fill(0);
  for(let i = 1; i <= n; i++){
    p[0] = i; let j0 = 0;
    const minv = Array(n+1).fill(INF), used = Array(n+1).fill(false);
    do{
      used[j0] = true; const i0 = p[j0]; let delta = INF, j1 = 0;
      for(let j = 1; j <= n; j++) if(!used[j]){
        const cur = cost[i0-1][j-1] - u[i0] - v[j];
        if(cur < minv[j]){ minv[j] = cur; way[j] = j0; }
        if(minv[j] < delta){ delta = minv[j]; j1 = j; }
      }
      for(let j = 0; j <= n; j++){ if(used[j]){ u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    }while(p[j0] !== 0);
    do{ const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; }while(j0);
  }
  const ans = Array(n).fill(-1);
  for(let j = 1; j <= n; j++) if(p[j]) ans[p[j]-1] = j-1;
  return ans;
}
function allocate(){
  const rs = roles(), ms = sortedMembers();
  runCalc('alloc', () => {
    if(!rs.length) throw new Error('1단계에서 역할 분담을 먼저 해 주세요.');
    const counts = rs.map(r => Math.max(1, Number(r.count) || 1));
    const notes = [];
    let total = counts.reduce((a,b) => a+b, 0);
    if(total < ms.length){   // 조원이 더 많으면 인원이 많은 역할부터 한 명씩 늘려요
      const add = {};
      while(total < ms.length){
        let bi = 0, bv = -1; counts.forEach((c,i) => { const L = libKeyOf(rs[i].name); if(L === 'lead' || L === 'present') return; const v = c / ((add[i]||0) + 1); if(v > bv){ bv = v; bi = i; } });
        counts[bi]++; add[bi] = (add[bi]||0) + 1; total++;
      }
      notes.push(`조원이 필요 인원보다 많아 ${Object.keys(add).map(i => `${rs[i].name} ${add[i]}명`).join(', ')}을 늘렸어요.`);
    }
    if(total > ms.length){   // 조원이 모자라면 인원이 많은 역할부터 줄여요
      const cut = {};
      while(total > ms.length){
        let bi = -1, bv = 1; counts.forEach((c,i) => { if(c > bv){ bv = c; bi = i; } });
        if(bi < 0) break;
        counts[bi]--; cut[bi] = (cut[bi]||0) + 1; total--;
      }
      if(Object.keys(cut).length) notes.push(`조원이 필요 인원보다 적어 ${Object.keys(cut).map(i => `${rs[i].name} ${cut[i]}명`).join(', ')}을 줄였어요.`);
    }
    const slots = []; counts.forEach((c,i) => { for(let k = 0; k < c; k++) slots.push(i); });
    const n = Math.max(ms.length, slots.length);
    // 비용 = -(적합도). 진단 안 한 조원은 모든 역할이 0점이라 남는 자리로 가요.
    const cost = Array.from({length:n}, (_, a) => Array.from({length:n}, (_, b) => {
      const m = ms[a], si = slots[b];
      if(!m || si == null || !m.scores) return 0;
      return -fitOf(m.scores, rs[si]);
    }));
    const res = hungarian(cost);
    const items = {}; const empty = new Set(slots.map((_, b) => b));
    ms.forEach((m, a) => {
      const b = res[a], si = slots[b]; empty.delete(b);
      if(si == null){ items[m.id] = {role:'', reason:'남는 역할이 없어요. 다른 역할을 함께 도와주세요.'}; return; }
      const r = rs[si];
      if(!m.scores){ items[m.id] = {role:r.name, reason:'진단 전이라 남은 역할을 맡았어요. 진단을 마치면 다시 배정해 보세요.'}; return; }
      const fit = fitOf(m.scores, r), best = rs.slice().sort((x,y) => fitOf(m.scores, y) - fitOf(m.scores, x))[0];
      const mt = roleMeta(r), s = m.scores[mt.c1] || 0;
      items[m.id] = {role:r.name, reason: best.name === r.name || fitOf(m.scores, best) === fit
        ? `${COMP[mt.c1].label} ${s}점으로 이 역할이 가장 잘 맞아요. (적합도 ${fit}%)`
        : `1순위는 ${best.name}이지만 팀 균형을 위해 맡았어요. ${COMP[mt.c1].label} ${s}점이라 충분히 잘할 수 있어요. (적합도 ${fit}%)`};
    });
    const unfilled = Array.from(empty).map(b => slots[b]).filter(si => si != null);
    if(unfilled.length) notes.push(`${Array.from(new Set(unfilled.map(si => rs[si].name))).join(', ')} 자리가 비어 있어요. 다른 역할과 겸해 주세요.`);
    const surveyed = ms.filter(m => m.scores && items[m.id] && items[m.id].role);
    if(surveyed.length){
      const avg = Math.round(surveyed.reduce((s, m) => s + fitOf(m.scores, rs.find(r => r.name === items[m.id].role)), 0) / surveyed.length);
      notes.unshift(`모든 경우를 따져 팀 전체 적합도가 가장 높은 배정을 골랐어요. 평균 적합도 ${avg}%예요.`);
    }
    saveTeam({allocation: {items, note: notes.join(' '), at: Date.now()}});
  });
}

/* ---------- 3. 마감일: 최종 마감에서 거꾸로, 작업 순서·분량 비율로 나눠요 ---------- */
const STAGE_W = {1:3, 2:3, 3:2, 4:1};
function savedAvoids(d){ d = d || {}; return Array.isArray(d.avoids) ? d.avoids : (d.avoid && d.avoid.start ? [d.avoid] : []); }
function draftAvoids(){
  if(S.draft.avoids == null){ const s = clone(savedAvoids(S.team.deadline)); S.draft.avoids = s.length ? s : [{start:'', end:''}]; }
  return S.draft.avoids;
}
function calcDeadlinePlan(rs, today, fin, avoids){
  avoids = (avoids || []).filter(a => a && a.start && a.end);
  const inAvoid = d => avoids.some(a => d >= a.start && d <= a.end);
  const work = []; for(let d = today; d < fin; d = addDays(d, 1)) if(!inAvoid(d)) work.push(d);
  if(!work.length) throw new Error('피할 기간을 빼면 작업할 날이 없어요. 기간을 다시 확인해 주세요.');
  const metas = rs.map(r => roleMeta(r));
  const stages = Array.from(new Set(metas.flatMap(m => m.stage === 0 ? [] : [m.stage, m.stageEnd]))).sort((a,b) => a-b);
  if(!stages.length) stages.push(2);
  const review = work.length >= 6 ? work[work.length - 1] : null;   // 마지막 작업일은 전체 검토용
  const E = review ? work.length - 1 : work.length;
  const tot = stages.reduce((s, st) => s + (STAGE_W[st] || 2), 0);
  const range = {}; let cum = 0, prev = -1;
  stages.forEach((st, i) => {
    cum += STAGE_W[st] || 2;
    const s = Math.min(prev + 1, E - 1);
    let e = Math.round(cum / tot * E) - 1;
    const room = E - 1 - (stages.length - 1 - i);
    if(e > room) e = Math.max(room, s);
    if(e < s) e = s;
    if(i === stages.length - 1) e = E - 1;
    range[st] = {s, e}; prev = e;
  });
  const crosses = (s, e) => avoids.some(a => s <= a.end && e >= a.start);
  const items = rs.map((r, i) => {
    const mt = metas[i];
    if(mt.stage === 0) return {role:r.name, start:work[0], due: review || work[E-1], reason:`처음부터 끝까지 일정을 챙기고 ${review ? fmtShort(review) + ' 전체 검토' : '마지막 점검'}까지 맡아요.`};
    const a = range[mt.stage], b = range[mt.stageEnd], days = b.e - a.s + 1;
    const before = rs.filter((x, j) => metas[j].stage > 0 && metas[j].stageEnd < mt.stage).map(x => x.name);
    return {role:r.name, start:work[a.s], due:work[b.e], reason:
      (before.length ? `${before.slice(-2).join('·')} 결과를 받아 이어서 해요. ` : '가장 먼저 끝나야 다음 작업이 시작돼요. ') +
      `작업일 ${days}일을 배정했어요${crosses(work[Math.max(0, a.s - 1)], work[b.e]) ? ' (피하는 기간 제외)' : ''}.`};
  });
  const milestones = [];
  if(stages.length > 1){ const st = stages[0]; milestones.push({date: work[range[st].e], title:'중간 점검'}); }
  if(review) milestones.push({date: review, title:'전체 검토'});
  milestones.push({date: fin, title:'최종 제출'});
  const overlap = E < stages.length;
  const advice = overlap
    ? '기간이 짧아 일부 작업을 겹쳐서 진행해야 해요. 자료조사가 끝나기 전에 PPT·보고서 틀부터 잡아 두세요.'
    : '각자 마감일에 결과물을 단톡방에 올려 다음 담당자에게 바로 넘겨 주세요. 늦어질 것 같으면 하루 전에 미리 알려 주세요.';
  return {items, milestones, advice};
}
function calcDeadline(){
  const rs = roles(), today = todayStr(), d0 = S.team.deadline || {};
  const fin = S.draft.finalDue || d0.final;
  const list = draftAvoids().map(a => ({start: a.start || '', end: a.end || ''}));
  runCalc('deadline', () => {
    if(!parseD(fin)) throw new Error('최종 마감일을 입력해 주세요.');
    if(diffDays(today, fin) < 1) throw new Error('최종 마감일은 내일 이후 날짜로 골라 주세요.');
    list.forEach((a, i) => {
      if((a.start && !a.end) || (!a.start && a.end)) throw new Error(`작업하기 어려운 기간 ${i+1}의 시작일과 종료일을 모두 골라 주세요.`);
      if(a.start && a.end && a.start > a.end) throw new Error(`작업하기 어려운 기간 ${i+1}의 시작일이 종료일보다 늦어요.`);
    });
    const avoids = list.filter(a => a.start && a.end).sort((a,b) => a.start.localeCompare(b.start));
    const r = calcDeadlinePlan(rs, today, fin, avoids);
    saveTeam({deadline: Object.assign({final: fin, today, avoids, avoid: null, at: Date.now()}, r)});
    S.draft.finalDue = null; S.draft.avoids = null;
  });
}

/* ---------- 4. 모임 추천: 가능 인원 → 마감 직후 → 이른 날짜 순 ---------- */
function meetRecs(cells, n){
  const dl = (S.team.deadline && S.team.deadline.items) || [];
  const handoff = {};   // 역할 마감 당일·다음 날 = 결과물 점검하기 좋은 날
  dl.forEach(it => { [it.due, addDays(it.due, 1)].forEach(d => { if(!handoff[d]) handoff[d] = it.role; }); });
  const cand = Object.entries(cells).filter(([,c]) => c.yes.length).map(([k,c]) => { const [date, slot] = k.split('|'); return {date, slot, c, bonus: handoff[date] ? 1 : 0}; })
    .sort((a,b) => (b.c.yes.length - a.c.yes.length) || (b.bonus - a.bonus) || a.date.localeCompare(b.date) || SLOTS.findIndex(s => s.k === a.slot) - SLOTS.findIndex(s => s.k === b.slot));
  const pick = [], days = new Set();
  cand.forEach(x => { if(pick.length < 3 && !days.has(x.date)){ pick.push(x); days.add(x.date); } });   // 되도록 서로 다른 날짜로
  cand.forEach(x => { if(pick.length < 3 && !pick.includes(x)) pick.push(x); });
  const top = pick.length ? pick[0].c.yes.length : 0;
  return pick.map((x, i) => ({date:x.date, slot:x.slot, reason:
    (x.c.yes.length === n ? '모든 조원이 가능해요.' : `${x.c.yes.length}/${n}명 가능해요.${x.c.yes.length === top ? ' 가능한 인원이 가장 많은 시간이에요.' : ''}`) +
    (x.bonus ? ` ${handoff[x.date]} 마감 즈음이라 결과물을 함께 점검하기 좋아요.` : i === 0 ? ' 그중 가장 빠른 시간이에요.' : '')}));
}
function recommendMeet(){
  const meet = S.team.meet || {};
  const {days} = meetRange();
  const {ms, cells} = heatData(days);
  runCalc('meet', () => {
    if(!ms.length) throw new Error('먼저 조원들이 되는 시간을 입력해야 해요.');
    const recs = meetRecs(cells, ms.length);
    if(!recs.length) throw new Error('입력된 시간 중 1명이라도 되는 시간이 없어요. 후보 기간을 넓혀 보세요.');
    const full = Object.values(cells).filter(c => c.yes.length === ms.length).length;
    const missing = full ? [] : cells[recs[0].date + '|' + recs[0].slot].no.map(x => x.name);
    const message = full ? `모두 가능한 시간이 ${full}개 있어요. 마음에 드는 시간을 확정해 주세요.`
      : `모두 되는 시간이 없어요. 추천 1순위에 빠지는 ${missing.join(', ')}님에게는 회의 내용을 정리해 공유해 주세요.`;
    saveTeam({meet: Object.assign({}, meet, {recs, message, auto: false, at: Date.now()})});
    toast(`추천 일정 ${recs.length}개가 나왔어요. 마음에 드는 일정을 확정해 주세요.`);
  });
  scrollToId('meet-recs');
}

/* =============================== 파일 읽기 =============================== */
const libCache = {};
function loadScript(src){
  if(!libCache[src]) libCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('라이브러리를 불러오지 못했어요'));
    document.head.appendChild(s);
  });
  return libCache[src];
}
async function loadLib(k){ for(const src of LIB[k]) await loadScript(src); }
function fileKind(f){
  const n = f.name.toLowerCase();
  if(f.type.startsWith('image/')) return 'image';
  if(n.endsWith('.pdf')) return 'pdf';
  if(n.endsWith('.docx')) return 'docx';
  if(n.endsWith('.hwpx')) return 'hwpx';
  if(n.endsWith('.hwp')) return 'hwp';
  if(n.endsWith('.doc')) return 'doc';
  if(n.endsWith('.txt') || n.endsWith('.md') || f.type.startsWith('text/')) return 'txt';
  return 'other';
}
async function readPdf(file){
  await loadLib('pdf');
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIB.pdf[1];
  const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const pages = Math.min(pdf.numPages, 30);
  let text = '';
  for(let i = 1; i <= pages; i++){
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    text += tc.items.map(it => it.str).join(' ') + '\n';
  }
  const chars = (text.match(/[가-힣A-Za-z0-9]/g) || []).length;
  if(chars < 20) throw new Error('PDF에서 글자를 읽지 못했어요(스캔본일 수 있어요). 과제 내용을 직접 붙여넣어 주세요.');
  return {text};
}
async function readDocx(file){
  await loadLib('docx');
  const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
  return {text: r.value};
}
async function readHwpx(file){
  await loadLib('zip');
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const names = Object.keys(zip.files).filter(n => /Contents\/section\d+\.xml$/i.test(n)).sort();
  let text = '';
  for(const n of names){
    const xml = new DOMParser().parseFromString(await zip.file(n).async('string'), 'application/xml');
    xml.querySelectorAll('p').forEach(p => {
      const line = Array.from(p.getElementsByTagName('*')).filter(e => e.localName === 't').map(e => e.textContent).join('');
      if(line.trim()) text += line + '\n';
    });
  }
  return {text};
}
async function addFiles(list){
  for(const f of Array.from(list)){
    if(S.draft.files.length >= 8){ toast('파일은 8개까지 올릴 수 있어요.'); break; }
    if(f.size > 20 * 1024 * 1024){ toast(`${f.name}: 20MB 이하 파일만 올릴 수 있어요.`); continue; }
    const kind = fileKind(f);
    const item = {id: Math.random().toString(36).slice(2), name: f.name, kind, status:'reading', text:'', images:[]};
    S.draft.files.push(item); render();
    try{
      if(kind === 'image'){ throw new Error('이미지 속 글자는 읽을 수 없어요. 과제 내용을 글로 붙여넣거나 PDF·DOCX로 올려 주세요.'); }
      else if(kind === 'txt'){ item.text = await f.text(); }
      else if(kind === 'pdf'){ Object.assign(item, await readPdf(f)); }
      else if(kind === 'docx'){ Object.assign(item, await readDocx(f)); }
      else if(kind === 'hwpx'){ Object.assign(item, await readHwpx(f)); }
      else if(kind === 'hwp'){ throw new Error('구형 한글(.hwp) 파일은 브라우저에서 읽을 수 없어요. 한글에서 [다른 이름으로 저장 → PDF 또는 HWPX]로 바꿔 올려 주세요.'); }
      else if(kind === 'doc'){ throw new Error('구형 워드(.doc) 파일은 읽을 수 없어요. .docx나 PDF로 저장해 올려 주세요.'); }
      else throw new Error('지원하지 않는 형식이에요. 텍스트, 이미지, PDF, DOCX, HWPX를 올려 주세요.');
      item.status = 'ok';
    }catch(e){ item.status = 'error'; item.error = e.message || '파일을 읽지 못했어요.'; }
    render();
  }
}

/* =============================== 2. 성향 진단 =============================== */
function scoresFrom(ans){
  const out = {};
  COMP_KEYS.forEach(k => {
    const vs = QUESTIONS.map((q,i) => q.c === k ? ans[i] : null).filter(v => v != null);
    out[k] = vs.length ? Math.round(((vs.reduce((a,b) => a+b, 0) / vs.length) - 1) / 4 * 100) : 0;
  });
  return out;
}
function radar(scores, size){
  size = size || 240;
  const W = size + 96;   // 좌우 글자(예: "조사력 75")가 들어갈 여백
  const cx = W/2, cy = size/2, R = size/2 - 34, n = COMP_KEYS.length;
  const pt = (i,v) => { const a = -Math.PI/2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const poly = v => COMP_KEYS.map((_,i) => pt(i,v).map(x => x.toFixed(1)).join(',')).join(' ');
  const data = COMP_KEYS.map((k,i) => pt(i, (scores[k]||0)/100).map(x => x.toFixed(1)).join(',')).join(' ');
  return `<svg width="${W}" height="${size}" viewBox="0 0 ${W} ${size}" role="img" aria-label="역량 레이더 차트: ${COMP_KEYS.map(k => `${COMP[k].label} ${scores[k]||0}점`).join(', ')}">
    ${[.25,.5,.75,1].map(v => `<polygon points="${poly(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${COMP_KEYS.map((_,i) => { const [x,y] = pt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('')}
    <polygon points="${data}" fill="color-mix(in srgb, var(--lav) 45%, transparent)" stroke="var(--lav-ink)" stroke-width="2" stroke-linejoin="round"/>
    ${COMP_KEYS.map((k,i) => { const [x,y] = pt(i,(scores[k]||0)/100); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--lav-ink)"/>`; }).join('')}
    ${COMP_KEYS.map((k,i) => { const [x,y] = pt(i,1.24); const anc = Math.abs(x-cx) < 4 ? 'middle' : x > cx ? 'start' : 'end';
      return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" font-size="12" fill="var(--ink)" font-weight="700">${COMP[k].label}<tspan fill="var(--muted)" font-weight="400"> ${scores[k]||0}</tspan></text>`; }).join('')}
  </svg>`;
}

function allocTable(ms, rs, alloc){

/* =============================== 4. 모임 =============================== */
function meetRange(){
  const m = S.team.meet || {};
  const today = todayStr();
  let start = m.start || today;
  let end = m.end || (S.team.deadline && S.team.deadline.final && S.team.deadline.final > today ? S.team.deadline.final : addDays(today, 13));
  if(diffDays(start, end) > 30) end = addDays(start, 30);
  if(end < start) end = start;
  const days = []; for(let s = start; s <= end; s = addDays(s, 1)) days.push(s);
  return {start, end, days};
}
function heatData(days){
  const ms = sortedMembers().filter(m => m.availSaved);
  const cells = {};
  days.forEach(d => SLOTS.forEach(s => {
    const key = d + '|' + s.k;
    const yes = ms.filter(m => (m.avail || []).includes(key));
    cells[key] = {yes, no: ms.filter(m => !yes.includes(m))};
  }));
  return {ms, cells};
}

          const isP = picked && picked.date === d && picked.slot === s.k;
          return `<td><button class="hc num ${r === 1 ? 'full' : ''} ${isP ? 'picked' : ''}" style="background:${heatBg(r)}" data-act="pickSlot" data-date="${d}" data-slot="${s.k}" title="가능: ${esc(c.yes.map(x => x.name).join(', ') || '없음')} / 불가: ${esc(c.no.map(x => x.name).join(', ') || '없음')}" aria-label="${esc(fmtD(d))} ${s.l} ${c.yes.length}명 가능">${c.yes.length}/${ms.length}</button></td>`; }).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <p class="note small">${fullSlots.length ? `모두 되는 시간 ${fullSlots.length}개: ${fullSlots.slice(0, 6).map(([k]) => { const [d,s] = k.split('|'); return `${fmtShort(d)} ${slotLabel(s)}`; }).join(', ')}${fullSlots.length > 6 ? ' 외' : ''}` : '모두가 되는 시간이 없어요. 추천을 받으면 가장 많은 인원이 되는 대안을 골라 줘요.'}</p>
      ${calcBtn('recommendMeet', recs.length ? '다시 추천받기' : '모임 날짜 추천받기')}

      `}
    </section>
  </div>

  ${S.busy.meet || recs.length ? `<section class="card" id="meet-recs">

      ${picked ? '<span class="pill ok">확정 완료</span>' : '<span class="pill peach">확정 전</span>'}</div>
    ${S.busy.meet ? '<div class="skel"></div><div class="skel"></div>' : `<div style="display:grid;gap:8px">${recs.map((r,i) => { const c = cells[r.date + '|' + r.slot]; const isP = picked && picked.date === r.date && picked.slot === r.slot; return `<div class="meetrec ${i === 0 ? 'top' : ''}">

        ${c.no.length ? `<p class="small muted">불가: ${esc(c.no.map(x => x.name).join(', '))}</p>` : ''}
        <p class="small">${esc(r.reason || '')}</p>
        <div>${isP ? '<span class="pill ok">이 일정으로 확정됨</span>' : `<button class="btn sm primary" data-act="pickSlot" data-date="${r.date}" data-slot="${r.slot}">이 일정으로 확정</button>`}</div>

function planText(){
  const t = S.team, rs = roles(), ms = sortedMembers();
  const alloc = (t.allocation && t.allocation.items) || {};
  const dl = (t.deadline && t.deadline.items) || [];
  const p = t.meet && t.meet.picked;
  const lines = [`[${t.course ? t.course + ' ' : ''}${t.name || '우리 팀'} 팀플 계획]`];
  if(rs.length){
    lines.push('', '■ 역할');
    rs.forEach(r => {
      const who = ms.filter(m => alloc[m.id] && alloc[m.id].role === r.name).map(m => m.name);
      const due = dl.find(i => i.role === r.name);
      lines.push(`- ${r.name}${who.length ? ` (${who.join(', ')})` : ` ${r.count}명`}${due ? ` · 마감 ${fmtD(due.due)}` : ''}`);
    });
  }
  if(t.deadline && t.deadline.final) lines.push('', `■ 최종 마감: ${fmtD(t.deadline.final)}`);
  if(p) lines.push('', `■ 모임: ${fmtD(p.date)} ${slotLabel(p.slot)}(${(SLOTS.find(s => s.k === p.slot) || {}).t || ''})${t.meet.purpose ? ' · ' + t.meet.purpose : ''}`);
  return lines.join('\n');
}
function planSummary(){
  return `<section class="card" id="plan-summary" style="border-color:var(--mint-ink)">

      <button class="btn primary" data-act="copyPlan">계획 복사하기</button></div>
    <pre class="note" style="white-space:pre-wrap;margin:0;font-family:var(--font-body);color:var(--ink)">${esc(planText())}</pre>
    ${currentView() !== 'home' ? `<div><a class="btn" href="${H('home')}">팀 홈으로</a></div>` : ''}
  </section>`;
}
function scrollToId(id){ requestAnimationFrame(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); }); }
/* =============================== 이벤트 =============================== */
const ACTIONS = {
  example(){ S.draft.assignText = EXAMPLE_TEXT; if(!S.draft.size && !S.team.size) S.draft.size = 5; render(); },
  rmFile(el){ const f = S.draft.files.find(x => x.id === el.dataset.id); if(f && f.url) URL.revokeObjectURL(f.url); S.draft.files = S.draft.files.filter(x => x.id !== el.dataset.id); render(); },
  analyze(){ analyze(); },
  cnt(el){ editRoles(rs => { const r = rs[+el.dataset.i]; if(r) r.count = clamp((r.count||1) + Number(el.dataset.d), 1, 12); }); },
  rmRole(el){ editRoles(rs => rs.splice(+el.dataset.i, 1)); },
  addRole(){ editRoles(rs => rs.push({name:'새 역할', icon:'📌', count:1, description:'할 일을 적어 주세요.', skills:[], competency:'research'})); },
  confirmRoles(){ const a = clone(S.team.assignment); a.confirmed = true; saveTeam({assignment: a}); toast('역할 분담을 확정했어요. 이제 성향 진단을 해 보세요.'); },
  submitSurvey(){ submitSurvey(); },
  retake(){ const m = me(); S.draft.retake = true; S.draft.answers = m && m.answers ? m.answers.slice() : Array(12).fill(null); render(); },
  cancelRetake(){ S.draft.retake = false; S.draft.answers = null; render(); },
  allocate(){ allocate(); },
  calcDeadline(){ calcDeadline(); },
  recommendMeet(){ recommendMeet(); },
  addAvoid(){ const l = draftAvoids(); if(l.length < 6) l.push({start:'', end:''}); render(); const ins = document.querySelectorAll('[data-av][data-avk="start"]'); if(ins.length) ins[ins.length - 1].focus(); },
  rmAvoid(el){ const l = draftAvoids(); l.splice(+el.dataset.i, 1); if(!l.length) l.push({start:'', end:''}); render(); },
  toggleSlot(el){
    const m = me(); if(!m) return;
    const tid = S.teamId;
    const set = new Set(m.avail || []); const k = el.dataset.k;
    set.has(k) ? set.delete(k) : set.add(k);
    const doc = clone(S.meDoc); doc.t = doc.t || {};
    doc.t[tid] = Object.assign({}, doc.t[tid] || {}, {avail: Array.from(set).sort(), availSaved: true});
    S.meDoc = doc; refreshMe(); render();
    clearTimeout(ACTIONS._avT);
    ACTIONS._avT = setTimeout(() => { ACTIONS._avT = null; const cur = (S.meDoc.t || {})[tid] || {}; saveMemberDoc({}, {avail: cur.avail || [], availSaved: true}, {}, tid); }, 600);
  },
  async copyLink(){ const url = location.origin + location.pathname + '#t-' + S.teamId; const msg = `[언제되조?] ${S.team.name || '우리 팀'} 팀플에 참여해 주세요!\n${url}\n(팀 코드: ${S.teamId})`;
    try{ await navigator.clipboard.writeText(msg); toast('초대 링크를 복사했어요. 단톡방에 붙여넣어 주세요.'); }catch(e){ toast(`복사가 막혀 있어요. 주소: ${url}`); } },
  async copyCode(){ try{ await navigator.clipboard.writeText(S.teamId); toast(`팀 코드 ${S.teamId}를 복사했어요. 조원에게 보내 주세요.`); }catch(e){ toast(`복사가 막혀 있어요. 팀 코드는 ${S.teamId}예요.`); } },
  leaveTeam(el){ if(!twoStep(el, '정말 나갈까요?')) return; const tid = S.teamId; leaveTeam(tid); location.hash = 'home'; toast('팀에서 나왔어요. 팀 코드로 언제든 다시 들어올 수 있어요.'); },
  deleteTeam(el){ if(!twoStep(el, '삭제하면 되돌릴 수 없어요. 한 번 더 누르세요')) return; deleteTeam(S.teamId); },
  noneAvail(){ saveMe({avail: [], availSaved: true}); toast('되는 시간이 없다고 저장했어요.'); },
  pickSlot(el){ const meet = Object.assign({}, S.team.meet || {}); meet.picked = {date: el.dataset.date, slot: el.dataset.slot}; saveTeam({meet}); toast(`${fmtD(el.dataset.date)} ${slotLabel(el.dataset.slot)}으로 모임을 확정했어요.`); scrollToId('plan-summary'); },
  async copyPlan(){ try{ await navigator.clipboard.writeText(planText()); toast('계획을 복사했어요. 단톡방에 붙여넣어 보세요.'); }catch(e){ toast('복사가 막혀 있어요. 아래 글을 길게 눌러 직접 복사해 주세요.'); } },
  unpick(){ const meet = Object.assign({}, S.team.meet || {}); meet.picked = null; saveTeam({meet}); },
  removeMember(el){ const m = S.members[el.dataset.id]; if(!m) return;
    if(el.dataset.confirm !== '1'){ el.dataset.confirm = '1'; el.textContent = '정말 내보낼까요?'; setTimeout(() => { if(el.isConnected){ el.dataset.confirm = ''; el.textContent = '내보내기'; } }, 3000); return; }
    removeMember(el.dataset.id); }
};
function twoStep(el, msg){
  if(el.dataset.confirm === '1') return true;
  const orig = el.textContent;
  el.dataset.confirm = '1'; el.textContent = msg;
  setTimeout(() => { if(el.isConnected){ el.dataset.confirm = ''; el.textContent = orig; } }, 3000);
  return false;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  e.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if(fn) fn(el, e);
  else { console.error('연결되지 않은 버튼:', el.dataset.act); toast('이 버튼이 아직 동작하지 않아요. 개발자에게 알려 주세요.'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.draft) S.draft[t.dataset.draft] = t.value;
  if(t.dataset.av != null){ const a = draftAvoids()[+t.dataset.av]; if(a) a[t.dataset.avk] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'file-in'){ addFiles(t.files); t.value = ''; return; }
  if(t.dataset.ans != null){
    const i = +t.dataset.ans, v = Number(t.value);
    S.draft.answers[i] = v; S.errors.type = null; render();
    const back = document.querySelector(`input[name="q${i}"][value="${v}"]`); if(back) back.focus({preventScroll:true});
    return;
  }
  if(t.dataset.roleName != null){ const v = t.value.trim().slice(0, 20); if(v) editRoles(rs => { const r = rs[+t.dataset.roleName]; if(r){ r.name = v; } }); return; }
  if(t.dataset.alloc != null){ const al = clone(S.team.allocation || {items:{}}); al.items = al.items || {}; al.items[t.dataset.alloc] = {role: t.value, reason: ''}; saveTeam({allocation: al}); return; }
  if(t.dataset.dl != null){ const d = clone(S.team.deadline); const it = d.items[+t.dataset.dl]; if(it && parseD(t.value)){ it.due = t.value; if(it.start > it.due) it.start = it.due; it.reason = '직접 수정한 날짜예요.'; saveTeam({deadline: d}); } return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  const readName = id => { const el = document.getElementById(id); return el ? el.value.trim().slice(0, 12) : myName(); };
  if(f === 'joinTeam'){
    const name = readName('jt-name');
    if(!name){ toast('이름을 입력해 주세요.'); return; }
    S.draft.name = '';
    joinTeam(S.teamId, myName() ? null : name);
    toast(`${name}님, 환영해요!`);
  }
  if(f === 'create'){
    const name = readName('ct-me'), tname = $('#ct-name').value.trim().slice(0, 30);
    if(!name || !tname){ toast('이름과 팀 이름을 입력해 주세요.'); return; }
    const size = parseInt($('#ct-size').value, 10);
    S.draft.name = '';
    createTeam({name: tname, course: $('#ct-course').value.trim().slice(0, 30), size: size >= 1 && size <= 12 ? size : null}, myName() ? null : name);
  }
  if(f === 'joinCode'){
    const name = readName('jc-me'), code = $('#jc-code').value.trim().toUpperCase();
    if(!name){ toast('이름을 입력해 주세요.'); return; }
    if(!/^[A-Z0-9]{6}$/.test(code)){ toast('팀 코드는 영문과 숫자 6자리예요.'); return; }
    (async () => {
      if(S.mode === 'live' && !S.teams[code]){
        try{ const s = await S.db.doc('teams/' + code).get(); if(s.exists) S.teams[code] = clone(s.data()); }
        catch(e){ toast('팀을 확인하지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
      }
      if(!S.teams[code]){ toast(`${code} 팀을 찾을 수 없어요. 코드를 다시 확인해 주세요.`); return; }
      S.draft.name = '';
      joinTeam(code, myName() ? null : name);
      location.hash = 't-' + code;
      toast(`${S.teams[code].name || code} 팀에 참여했어요.`);
    })();
  }
  if(f === 'myname'){
    const name = $('#mn-name').value.trim().slice(0, 12);
    if(!name){ toast('이름을 입력해 주세요.'); return; }
    saveMemberDoc({name}, {}, {});
    toast('이름을 바꿨어요.');
  }
  if(f === 'team'){
    const size = parseInt($('#t-size').value, 10);
    saveTeam({name: $('#t-name').value.trim().slice(0, 30), course: $('#t-course').value.trim().slice(0, 30), size: size >= 1 && size <= 12 ? size : (S.team.size || null)});
    toast('팀 정보를 저장했어요.');
  }
  if(f === 'period'){
    let s = $('#mt-start').value, en = $('#mt-end').value;
    if(!parseD(s) || !parseD(en)){ toast('시작일과 종료일을 모두 골라 주세요.'); return; }
    if(en < s){ toast('종료일은 시작일 이후여야 해요.'); return; }
    if(diffDays(s, en) > 30){ en = addDays(s, 30); toast('최대 31일까지라 종료일을 맞췄어요.'); }
    const meet = Object.assign({}, S.team.meet || {}, {start: s, end: en, purpose: $('#mt-purpose').value.trim().slice(0, 40)});
    saveTeam({meet});
    toast('후보 기간을 저장했어요.');
  }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });

/* =============================== 시작 =============================== */
function goLocal(){
  S.mode = 'local'; S.uid = 'local';
  try{ const raw = JSON.parse(localStorage.getItem('teamplmate-local-v2') || 'null'); if(raw){ S.teams = raw.teams || {}; S.meDoc = raw.meDoc || null; } }catch(e){}
  S.loaded = {teams:true, me:true, members:true};
  S.teamId = null; applyRoute();
}
function dbFail(err){ S.flags.slow = false; S.flags.dbErr = (err && err.code) || 'unavailable'; scheduleRender(); }
let loadTimer = null;
function subscribeMembers(){
  if(S.unsubMembers){ S.unsubMembers(); S.unsubMembers = null; }
  S.members = {}; S.rawMembers = {};
  refreshMe();
  if(S.mode !== 'live' || !S.teamId) return;
  const tid = S.teamId;
  S.unsubMembers = S.db.collection('members').where('teamIds', 'array-contains', tid).onSnapshot(snap => {
    if(tid !== S.teamId) return;
    const raw = {}, flat = {};
    snap.docs.forEach(d => { raw[d.id] = clone(d.data()); flat[d.id] = flatMember(raw[d.id], tid); });
    S.rawMembers = raw; S.members = flat;
    refreshMe();   // 내 항목은 방금 고친 로컬 값을 우선
    scheduleRender();
  }, dbFail);
}
/* ---------- Firebase 연결 ----------
   Firestore를 이 사이트가 쓰던 저장 방식(doc/collection/update 병합)과 똑같이 쓰도록 감싸요. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAiOloGTLxnnF78AhVTHL2lOkgLxZ6MJJw",
  authDomain: "eonjedoejo.firebaseapp.com",
  projectId: "eonjedoejo",
  storageBucket: "eonjedoejo.firebasestorage.app",
  messagingSenderId: "488828000799",
  appId: "1:488828000799:web:7d4c73a8cd2b1771e4132a"
};
const FB_SDK = ['app','auth','firestore'].map(n => `https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}-compat.js`);
function makeDb(fs){
  // update는 중첩된 값을 덮어쓰지 않고 합치도록 'a.b.c' 경로로 펼쳐요
  const flat = (o, pre, out) => { Object.entries(o).forEach(([k, v]) => { const p = pre ? pre + '.' + k : k;
    if(v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) flat(v, p, out); else out[p] = v; }); return out; };
  const wrapDoc = s => ({exists: s.exists, id: s.id, data: () => s.data(), metadata: s.metadata});
  return {
    doc: path => { const r = fs.doc(path); return {
      get: () => r.get().then(wrapDoc),
      set: d => r.set(d),
      update: d => r.update(flat(d, '', {})),
      delete: () => r.delete(),
      onSnapshot: (cb, err) => r.onSnapshot(s => cb(wrapDoc(s)), err)
    }; },
    collection: name => ({ where: (f, op, v) => ({ onSnapshot: (cb, err) => fs.collection(name).where(f, op, v).onSnapshot(s => cb({docs: s.docs, metadata: s.metadata}), err) }) })
  };
}
// 내가 참여한 팀 + 지금 보고 있는 팀만 하나씩 불러와요 (다른 팀 정보는 받지 않아요)
const teamSubs = {};
S.teamLoaded = {};
function syncTeamSubs(){
  if(S.mode !== 'live') return;
  const want = new Set(((S.meDoc && S.meDoc.teamIds) || []).concat(S.teamId ? [S.teamId] : []));
  Object.keys(teamSubs).forEach(id => { if(!want.has(id)){ teamSubs[id](); delete teamSubs[id]; delete S.teams[id]; delete S.teamLoaded[id]; } });
  want.forEach(id => {
    if(teamSubs[id]) return;
    teamSubs[id] = S.db.doc('teams/' + id).onSnapshot(snap => {
      if(snap.exists) S.teams[id] = clone(snap.data()); else delete S.teams[id];
      S.teamLoaded[id] = true;
      if(id === S.teamId) syncTeam();
      scheduleRender();
    }, err => { S.teamLoaded[id] = true; delete S.teams[id]; if(err && err.code !== 'permission-denied') dbFail(err); scheduleRender(); });
  });
}
async function boot(){
  render();
  let fb = null;
  try{
    for(const src of FB_SDK) await loadScript(src);
    fb = window.firebase;
    if(!fb.apps.length) fb.initializeApp(FIREBASE_CONFIG);
    const cred = fb.auth().currentUser ? null : await fb.auth().signInAnonymously();
    S.uid = (cred && cred.user && cred.user.uid) || fb.auth().currentUser.uid;
  }catch(e){
    console.error(e);
    S.flags.connErr = (e && e.code) || 'network';
    goLocal(); return;
  }
  const db = makeDb(fb.firestore());
  const uid = S.uid;
  S.db = db; S.mode = 'live';
  S.loaded.teams = true;   // 팀은 하나씩 불러오므로 팀별 로딩 표시로 대신해요
  loadTimer = setTimeout(() => { if(!S.loaded.me){ S.flags.slow = true; scheduleRender(); } }, 10000);
  const settle = () => { if(S.loaded.me){ clearTimeout(loadTimer); S.flags.slow = false; } };
  db.doc('members/' + uid).onSnapshot(snap => {
    S.meExists = snap.exists;
    const next = snap.exists ? clone(snap.data()) : null;
    // 내 가능 시간을 고치는 중(저장 대기)이면 로컬 값을 유지
    if(ACTIONS._avT && next && S.meDoc && S.meDoc.t && S.teamId && S.meDoc.t[S.teamId]){
      next.t = next.t || {}; next.t[S.teamId] = Object.assign({}, next.t[S.teamId] || {}, {avail: S.meDoc.t[S.teamId].avail, availSaved: true});
    }
    S.meDoc = next; refreshMe(); syncTeamSubs();
    if(!snap.metadata.fromCache) S.loaded.me = true;
    settle(); scheduleRender();
  }, err => { clearTimeout(loadTimer); dbFail(err); });
  S.teamId = null; applyRoute();
}
boot();
